  --bg:#071A3A; --surface:#0E2750; --ink:#EEF2FA; --muted:#A8B7D0; --line:#23406E;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.6}
.wrap{direction:rtl;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2{font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.5vw,2.6rem)} h2{font-size:1.45rem}
p{margin:.5rem 0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}

.brand{font-weight:800;color:var(--hi);letter-spacing:.02em}

.shot img{display:block;width:100%;border-radius:12px;box-shadow:var(--shadow);max-width:100%}
.meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-weight:800;color:var(--hi);font-size:1.5rem;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

.body{margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}
.jump{font:inherit;font-weight:700;font-size:.9rem;color:var(--hi);background:var(--hi-soft);border:0;border-radius:999px;padding:6px 14px;margin-top:10px;cursor:pointer;min-height:36px}
.answer{margin-top:16px}
.answer label{display:block;font-weight:800;margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;direction:rtl}
textarea:focus,.jump:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.status{font-size:.85rem;color:var(--muted);margin-top:4px;min-height:1.3em}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.general{margin-top:28px;background:var(--chg-soft);border-radius:18px;padding:18px}
.send{margin-top:28px;padding-top:22px;border-top:2px solid var(--hi)}
.send .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.send .hint{color:var(--muted);font-size:.95rem;flex:1 1 240px}
button.primary{font:inherit;font-weight:800;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;min-height:44px}
button.primary:disabled{opacity:.55;cursor:default}
button.primary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sent{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px;font-weight:700}
@media (max-width:640px){ .item{grid-template-columns:1fr;padding:14px} .shot{max-width:280px;margin-inline:auto;width:100%} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
