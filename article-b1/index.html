    if(ok){ m.style.cssText=''; m.textContent='נשמר, תודה '+who+'. אפשר להמשיך לערוך ולשמור שוב.'; if(b){ b.disabled=false; b.textContent='שמור שוב'; } return; }
    m.style.cssText='background:var(--warn-soft);color:var(--warn)'; m.textContent='השמירה לא הצליחה. העתיקו את הטקסט ושלחו אותו:';
    const ta=document.createElement('textarea'); ta.id='fallbacktext'; ta.readOnly=true; ta.value=compile(); m.after(ta);
    if(b){ b.disabled=false; b.textContent='נסו שוב'; }
  }
  $('sendbtn').addEventListener('click',send);
})();
</script>
