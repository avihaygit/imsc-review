<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>ביקורת מאמר B4 · IMSC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* ===== Brand tokens: swap these per project (light first, then dark) ===== */
:root{
  --bg:#F3F0E8; --surface:#FFFFFF; --ink:#0A2350; --muted:#4F5E78; --line:#DCD6C8;
  --accent:#06265A; --accent-ink:#F5F1E8; --hi:#0A7D7D; --hi-soft:#DDF1EF; --chg:#8A6614; --chg-soft:#F6ECD2;
  --field:#FFFFFF; --ok:#1E7A52; --ok-soft:#DDF1E6; --warn:#A04C0C; --warn-soft:#FBE8D6; --shadow:0 12px 30px rgba(6,38,90,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071A3A; --surface:#0E2750; --ink:#EEF2FA; --muted:#A8B7D0; --line:#23406E;
    --accent:#12BCBC; --accent-ink:#06265A; --hi:#12BCBC; --hi-soft:#123E55; --chg:#E0BC6A; --chg-soft:#3A2F16;
    --field:#0A2045; --ok:#5DD39E; --ok-soft:#173A2B; --warn:#F0A25E; --warn-soft:#432A12; --shadow:0 12px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071A3A; --surface:#0E2750; --ink:#EEF2FA; --muted:#A8B7D0; --line:#23406E;
  --accent:#12BCBC; --accent-ink:#06265A; --hi:#12BCBC; --hi-soft:#123E55; --chg:#E0BC6A; --chg-soft:#3A2F16;
  --field:#0A2045; --ok:#5DD39E; --ok-soft:#173A2B; --warn:#F0A25E; --warn-soft:#432A12; --shadow:0 12px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.6}
.wrap{direction:rtl;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2{font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.5vw,2.6rem)} h2{font-size:1.45rem}
p{margin:.5rem 0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--hi);letter-spacing:.02em}
.progress{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hi);transition:width .3s ease}
.intro{padding-block:28px 12px;display:grid;gap:10px}
.intro p{color:var(--muted);max-width:62ch}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.9rem;font-weight:600}
.player{margin-top:14px;max-width:340px}
.player video{display:block;width:100%;border-radius:14px;background:#000;box-shadow:var(--shadow)}
.items{display:grid;gap:28px;margin-top:20px}
.item{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:24px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.item.noimg{grid-template-columns:1fr}
.shot img{display:block;width:100%;border-radius:12px;box-shadow:var(--shadow);max-width:100%}
.meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-weight:800;color:var(--hi);font-size:1.5rem;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.chg{display:inline-block;background:var(--chg-soft);color:var(--chg);font-size:.78rem;font-weight:800;padding:.05em .6em;border-radius:99px;vertical-align:middle}
.changed{background:var(--chg-soft);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:.95rem}
.label{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:14px}
.quote{background:var(--hi-soft);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:4px;white-space:pre-line}
.body{margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}
.jump{font:inherit;font-weight:700;font-size:.9rem;color:var(--hi);background:var(--hi-soft);border:0;border-radius:999px;padding:6px 14px;margin-top:10px;cursor:pointer;min-height:36px}
.answer{margin-top:16px}
.answer label{display:block;font-weight:800;margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;direction:rtl}
textarea:focus,.jump:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.status{font-size:.85rem;color:var(--muted);margin-top:4px;min-height:1.3em}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.general{margin-top:28px;background:var(--chg-soft);border-radius:18px;padding:18px}
.send{margin-top:28px;padding-top:22px;border-top:2px solid var(--hi)}
.send .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.send .hint{color:var(--muted);font-size:.95rem;flex:1 1 240px}
button.primary{font:inherit;font-weight:800;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 32px;cursor:pointer;min-height:44px}
button.primary:disabled{opacity:.55;cursor:default}
button.primary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sent{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px;font-weight:700}
@media (max-width:640px){ .item{grid-template-columns:1fr;padding:14px} .shot{max-width:280px;margin-inline:auto;width:100%} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="row"><span class="brand" id="brand"></span><span class="progress" id="progress"></span></div>
    <div class="bar"><i id="barfill"></i></div>
  </header>
  <section class="intro">
    <h1 id="h1"></h1>

  <section class="general">

    <p id="general-hint"></p>

  </section>
  <div class="send" id="sendwrap">

  </div>
</div>

<script>
/* ===================== CONFIG — the only part to edit per review ===================== */
const CONFIG = {

 "intro": "המאמר לאישור ד״ר מנואל צווקר. כתבו רק מה שצריך לשנות, ותיבה ריקה = מאושר. אחרי הפסקאות יש עובדות לבדיקה (א) ושאלות קצרות (ש), שהתשובות עליהן ייכנסו למאמר. בסוף כתבו את שמכם ולחצו \"שמור\".",
 "facts": [

 "video": null,
 "generalHint": "על המאמר כולו: מבנה, טון, מה חסר או מיותר.",
 "doc": "reviews/article-b4-v1",
 "ls": "imsc-article-b4-v1",
 "sendTitle": "הערות למאמר B4, סבב 1:",
 "itemWord": "פריט",
 "items": [
  {
   "k": "p01",
   "n": "01",
   "t": "בקצרה",
   "body": "• ההשפעה נמשכת בדרך כלל שלושה עד ארבעה חודשים, ויורדת בהדרגה.\n• היא נגמרת כי העצב משקם את היכולת להעביר אותות לשריר. זה צפוי ולא סימן לכישלון.\n• לא מזריקים שוב לפני שעברו שלושה חודשים, כדי להקטין את הסיכון שהגוף יפתח נוגדנים לחומר.\n• סבב נוסף הוא החלטה, לא אוטומט. בודקים מה הושג מול המטרה."
  },
  {
   "k": "p02",
   "n": "02",
   "t": "פתיח",
   "body": "הנוקשות חזרה, והשאלה הראשונה היא כמה זמן בוטולינום טוקסין (בוטוקס) מחזיק ומתי אפשר להזריק שוב. השאלה השנייה, שפחות משפחות שואלות, היא אם בכלל צריך. במאמר הזה תמצאו למה ההשפעה של בוטולינום טוקסין (המוכר בשם בוטוקס) זמנית, למה יש מרווח מינימלי בין הזרקות ואיך מחליטים על הסבב הבא."

  {
   "k": "p03",
   "n": "03",
   "t": "כמה זמן בוטולינום טוקסין (בוטוקס) מחזיק בספסטיות?",
   "body": "ההשפעה מתחילה בהדרגה, בדרך כלל תוך כשבועיים, מגיעה לשיא בערך ארבעה עד שישה שבועות אחרי ההזרקה ונמשכת שלושה עד ארבעה חודשים. לקראת הסוף הנוקשות חוזרת לאט, ואין יום אחד שבו \"זה נגמר\"."

   "body": "הטווח הזה הוא ממוצע, ולא כל אחד נמצא באמצע שלו. יש מי שמרגישים ירידה מוקדם יותר, ויש מי שההשפעה נמשכת אצלם יותר זמן, כי הגודל של השריר, הכמות שהוזרקה, חומרת הספסטיות ומה שעושים בחודשים שאחרי משפיעים על התחושה. לכן את מפגש המעקב קובעים לקראת סוף הסבב, ולא מחכים שהנוקשות תחזור במלואה. מה מרגישים בכל שבוע אחרי ההזרקה מפורט במאמר מה מרגישים אחרי בוטולינום טוקסין (בוטוקס) לספסטיות [→ /articles/after-botox-injection-spasticity]."

  {

  {

  {

  },
  {
   "k": "p08",
   "n": "08",
   "t": "למה לא מזריקים שוב לפני שלושה חודשים?",
   "body": "זה לא קורה הרבה, ובסקירה של הספרות המחקרית, שיעור הנוגדנים המנטרלים אצל מטופלים בתכשירים הנפוצים של בוטולינום טוקסין מסוג A היה נמוך. אבל הסיכון עולה בשלושה מצבים: מנות גדולות בכל הזרקה, כמות מצטברת גדולה לאורך זמן ומרווחים קצרים בין הזרקות. במיוחד מסוכנות הזרקות \"השלמה\" שבוע או שבועיים אחרי טיפול. לכן גם ההנחיות הקליניות וגם הוראות היצרן קובעות מרווח של שלושה חודשים לפחות."
  },
  {
   "k": "p09",
   "n": "09",
   "t": "למה לא מזריקים שוב לפני שלושה חודשים?",
   "body": "המשמעות המעשית: גם אם הנוקשות חזרה מוקדם, לא מקדימים את ההזרקה הבאה, אלא בודקים למה, ומשנים את התוכנית בסבב הבא."
  },
  {
   "k": "p10",
   "n": "10",
   "t": "למה לא מזריקים שוב לפני שלושה חודשים?",

  {
   "k": "p12",

  {

  {
   "k": "p14",
   "n": "14",
   "t": "האם זה עובד טוב יותר עם הזמן?",

  {
   "k": "p15",
   "n": "15",
   "t": "מה עושים בחודשים שבין ההזרקות?",

  {
   "k": "p16",
