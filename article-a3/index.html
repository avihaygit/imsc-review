    $('who').removeAttribute('aria-invalid'); $('who').style.borderColor=''; $('who-err').hidden=true;
    let ok=false;
    if(C.inbox){ try{ await fetch(C.inbox,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({project:C.project||'',round:C.doc,name:who,notes:collect()})}); ok=true; }catch(e){} }
    let m=box.querySelector('.sent'); if(!m){ m=document.createElement('div'); m.className='sent'; m.setAttribute('role','status'); box.prepend(m); }
    const fb=$('fallbacktext'); if(fb) fb.remove();
    if(ok){ m.style.cssText=''; m.textContent='נשמר, תודה '+who+'. אפשר להמשיך לערוך ולשמור שוב.'; if(b){ b.disabled=false; b.textContent='שמור שוב'; } return; }
    m.style.cssText='background:var(--warn-soft);color:var(--warn)'; m.textContent='השמירה לא הצליחה. העתיקו את הטקסט ושלחו אותו:';
    const ta=document.createElement('textarea'); ta.id='fallbacktext'; ta.readOnly=true; ta.value=compile(); m.after(ta);
    if(b){ b.disabled=false; b.textContent='נסו שוב'; }
  }
  $('sendbtn').addEventListener('click',send);
})();
</script>

</body></html>
