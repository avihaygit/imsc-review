(function(){
  const C=CONFIG, $=id=>document.getElementById(id);
  $('brand').textContent=C.brand; $('h1').textContent=C.h1; $('intro').textContent=C.intro; $('ghint').textContent=C.generalHint;
  C.facts.forEach(f=>{ const s=document.createElement('span'); s.textContent=f; $('facts').appendChild(s); });
  function addText(parent,text){
    text.split(/(https?:\/\/[^\s)]+)/).forEach(part=>{
      if(/^https?:\/\//.test(part)){ const a=document.createElement('a'); a.href=part; a.textContent=part; a.target='_blank'; a.rel='noopener noreferrer'; a.dir='ltr'; parent.appendChild(a); }
      else if(part){ parent.appendChild(document.createTextNode(part)); }
    });
  }
  const ORDER=[], LABEL={}, areas={};
  let curSec='';
  C.items.forEach(it=>{
    if(it.sec!==curSec){ curSec=it.sec; const S=C.secs[it.sec];
      if(S){ const hd=document.createElement('section'); hd.className='sec';
        const h2=document.createElement('h2'); h2.textContent=S.t; const sp=document.createElement('p'); sp.textContent=S.d;
        hd.appendChild(h2); hd.appendChild(sp); $('items').appendChild(hd); } }
    ORDER.push(it.k); LABEL[it.k]=C.itemWord+' '+it.n+' · '+it.t+(it.snip?': '+it.snip:'');
    const sec=document.createElement('section'); sec.className='item';
    const meta=document.createElement('div'); meta.className='meta';
    const num=document.createElement('span'); num.className='num'; num.textContent=it.n;
    const top=document.createElement('span'); top.textContent=it.t;
    meta.appendChild(num); meta.appendChild(top);
    if(it.chg){ const c=document.createElement('span'); c.className='chg'; c.textContent='שונה'; meta.appendChild(c); }
    const body=document.createElement('p'); body.className='body'; addText(body,it.body);
    let note=null;
    if(it.chg){ note=document.createElement('div'); note.className='chgnote'; const nb=document.createElement('b'); nb.textContent='מה השתנה'; note.appendChild(nb); note.appendChild(document.createTextNode(it.chg)); }
    const ans=document.createElement('div'); ans.className='answer';
    const lab=document.createElement('label'); lab.setAttribute('for','a-'+it.k); lab.textContent='ההערה שלי (ריק = מאושר)';
    const ta=document.createElement('textarea'); ta.id='a-'+it.k; ta.dataset.key=it.k;
    const st=document.createElement('div'); st.className='status'; st.id='st-'+it.k;
    ans.appendChild(lab); ans.appendChild(ta); ans.appendChild(st);
    sec.appendChild(meta); sec.appendChild(body); if(note) sec.appendChild(note); sec.appendChild(ans);
    $('items').appendChild(sec);
  });
  ORDER.push('general'); LABEL.general='הערה כללית';
  ORDER.forEach(k=>{ areas[k]=$('a-'+k); });
  let state={answers:{},who:''};
  try{ const raw=localStorage.getItem(C.ls); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){}
  ORDER.forEach(k=>{ if(state.answers[k]) areas[k].value=state.answers[k]; });
  if(state.who) $('who').value=state.who;
  function lsSave(){ try{ localStorage.setItem(C.ls,JSON.stringify(state)); return true; }catch(e){ return false; } }
  function setStatus(k,t,cls){ const s=$('st-'+k); s.textContent=t; s.className='status '+(cls||''); }
  function progress(){ const n=ORDER.filter(k=>k!=='general'&&(areas[k].value||'').trim()).length, m=C.items.length;
    $('progress').textContent=n+' פריטים עם הערה מתוך '+m; $('barfill').style.width=(m?Math.round(100*n/m):0)+'%'; }
  progress();
  const timers={};
  ORDER.forEach(k=>{ areas[k].addEventListener('input',()=>{
    setStatus(k,'');
    clearTimeout(timers[k]);
    timers[k]=setTimeout(()=>{ state.answers[k]=areas[k].value; state.updatedAt=new Date().toISOString(); const ok=lsSave(); setStatus(k, ok?'נשמר במכשיר הזה':'לא הצלחנו לשמור במכשיר', ok?'ok':'warn'); progress(); },800);
  }); });
  $('who').addEventListener('input',()=>{ state.who=$('who').value; lsSave(); });
  function collect(){ const notes=[]; ORDER.forEach(k=>{ const v=(areas[k].value||'').trim(); if(v) notes.push({item:LABEL[k],note:v}); }); return notes; }
  async function send(){
    const b=$('sendbtn2')||$('sendbtn'); if(b){ b.disabled=true; b.textContent='שומר...'; }
    ORDER.forEach(k=>{ state.answers[k]=areas[k].value; }); state.updatedAt=new Date().toISOString(); lsSave();
    const who=($('who').value||'').trim();
    const box=document.querySelector('#sendwrap .box');
    let ok=false;
    try{ await fetch(C.inbox,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({project:C.project||'',round:C.doc,name:who||'ללא שם',notes:collect()})}); ok=true; }catch(e){}
    if(ok){ box.innerHTML='<div class="sent"></div><button class="primary" id="sendbtn2" type="button">שמור שוב</button>'; box.querySelector('.sent').textContent='נשמר'+(who?', תודה '+who:'')+'. אפשר להמשיך לכתוב ולשמור שוב.'; $('sendbtn2').addEventListener('click',send); return; }
    box.innerHTML='<div class="sent" style="background:var(--warn-soft);color:var(--warn)">השמירה לא הצליחה. העתיקו את הטקסט ושלחו אותו:</div><textarea id="fallbacktext" readonly></textarea><button class="primary" id="sendbtn2" type="button">נסו שוב</button>';
    $('fallbacktext').value=(who?who+'\n\n':'')+collect().map(n=>n.item+'\n'+n.note).join('\n\n');
    $('sendbtn2').addEventListener('click',send);
  }
  $('sendbtn').addEventListener('click',send);
})();
</script>
